<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E7"/>
      <stop offset="60%" stop-color="#F3E2C8"/>
      <stop offset="100%" stop-color="#E8C99F"/>
    </linearGradient>
    <radialGradient id="light" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B5F58"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.92)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.78)"/>
    </linearGradient>
  </defs>

  <!-- Background warm gradient -->
  <rect width="600" height="700" fill="url(#bg)"/>
  <rect width="600" height="700" fill="url(#light)"/>

  <!-- Soft decorative blobs -->
  <circle cx="520" cy="80" r="170" fill="rgba(255,255,255,0.25)"/>
  <circle cx="80" cy="640" r="180" fill="rgba(232,201,159,0.4)"/>

  <!-- Botanical leaves (스파 분위기) -->
  <g transform="translate(80, 80)" opacity="0.6">
    <path d="M 0 80 Q 30 40 60 0 Q 60 50 30 90 Z" fill="url(#leaf)"/>
    <path d="M 20 100 Q 60 70 100 30 Q 90 80 50 110 Z" fill="url(#leaf)" opacity="0.7"/>
  </g>
  <g transform="translate(480, 540) rotate(180)" opacity="0.5">
    <path d="M 0 80 Q 30 40 60 0 Q 60 50 30 90 Z" fill="url(#leaf)"/>
    <path d="M 20 100 Q 60 70 100 30 Q 90 80 50 110 Z" fill="url(#leaf)" opacity="0.7"/>
  </g>

  <!-- Center elegant card -->
  <g transform="translate(150, 190)">
    <rect width="300" height="320" rx="44" fill="url(#card)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    <rect width="300" height="320" rx="44" fill="none" stroke="rgba(11,95,88,0.08)" stroke-width="1" transform="translate(0.5, 0.5)"/>

    <!-- Brand mark "간" -->
    <rect x="105" y="55" width="90" height="90" rx="22" fill="url(#leaf)"/>
    <text x="150" y="122" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="48" font-weight="900" fill="#fff">간</text>

    <!-- Brand name -->
    <text x="150" y="180" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="800" fill="#0B5F58" letter-spacing="-0.8">간다<tspan fill="#0EA89B">GO</tspan></text>

    <!-- Divider line -->
    <line x1="110" y1="200" x2="190" y2="200" stroke="#D4B889" stroke-width="1.2"/>

    <!-- Tagline -->
    <text x="150" y="230" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#0B5F58" letter-spacing="0.5">전국 출장마사지</text>
    <text x="150" y="254" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="500" fill="#8B6F47" letter-spacing="1">검증된 정보를 한곳에서</text>

    <!-- Phone tag -->
    <rect x="80" y="278" width="140" height="28" rx="14" fill="#0B5F58"/>
    <text x="150" y="297" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#fff" letter-spacing="0.6">24시 친절 안내</text>
  </g>
</svg>
