name: Auto Magazine Post

on:
  schedule:
    # 매주 월요일 오전 9시 KST (= 월요일 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate magazine post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "Magazine Bot"
          git config user.email "bot@gandago-massage5.netlify.app"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "magazine: $(date +'%Y-%m-%d') 자동 발행"
          git push
          echo "pushed=true" >> $GITHUB_OUTPUT

      # Netlify 배포 대기 (커밋 후 약 90초)
      - name: Wait for deploy
        if: steps.commit.outputs.pushed == 'true'
        run: sleep 90

      # IndexNow 즉시 색인 제출 (Bing·Yandex·Seznam 즉시 반영)
      # Google/Bing 의 sitemap ping 엔드포인트는 2023년 폐기되어 IndexNow 로 대체함.
      - name: Submit URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        run: |
          KEY=16e565e44992937c568b7cada0d76106
          HOST=gandago-massage5.netlify.app
          KEYLOC="https://$HOST/$KEY.txt"
          # 새로 발행된 최신 매거진 글 URL + 핵심 허브 URL 제출
          LATEST=$(grep -oE 'https://[^<]+' sitemap-magazine.xml | tail -1)
          for U in "https://$HOST/" "https://$HOST/magazine/" "$LATEST"; do
            [ -z "$U" ] && continue
            curl -s -o /dev/null -w "IndexNow %{http_code}: $U\n" \
              "https://api.indexnow.org/indexnow?url=$U&key=$KEY&keyLocation=$KEYLOC" || true
          done
          # 참고: Google 은 ping API 가 없어 Search Console 사이트맵 자동 크롤에 의존,
          #       Naver 는 Search Advisor 에서 sitemap.xml 제출 + '웹 페이지 수집' 요청으로 색인.
