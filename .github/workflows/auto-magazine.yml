name: Auto Magazine Post

on:
  schedule:
    # 월·수·금 오전 9시 KST (= UTC 0시)
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate magazine post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: Commit and push
        run: |
          git config user.name "Magazine Bot"
          git config user.email "bot@gandago.me"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "magazine: $(date +'%Y-%m-%d') 자동 발행"
          git push
